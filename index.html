<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ももちゃんのくりまんじゅうビッグバン - 新仕様完成版</title>
  <style>
    body { font-family: sans-serif; text-align: center; background: #111; color: #fff; margin: 0; padding: 10px; user-select: none; }
    #game-container { position: relative; width: 360px; height: 640px; margin: 0 auto; overflow: hidden; border: 3px solid #d2691e; border-radius: 12px; }
    canvas { background: #2b1d0c; display: block; cursor: pointer; }
    
    .ui-top { position: absolute; top: 5px; left: 5px; right: 5px; background: rgba(0,0,0,0.85); padding: 6px; border-radius: 6px; font-weight: bold; font-size: 11px; text-align: left; pointer-events: none; }
    .ui-money { color: #55ff55; font-size: 14px; font-weight: bold; }
    #status-msg { position: absolute; bottom: 5px; left: 5px; right: 5px; color: #ffeb3b; font-weight: bold; font-size: 11px; background: rgba(0,0,0,0.85); padding: 5px; border-radius: 4px; pointer-events: none; }
    
    @keyframes red-flash {
      0% { box-shadow: inset 0 0 10px rgba(255, 0, 0, 0.3); }
      50% { box-shadow: inset 0 0 70px rgba(255, 0, 0, 0.95); }
      100% { box-shadow: inset 0 0 10px rgba(255, 0, 0, 0.3); }
    }
    .pinch-mode { animation: red-flash 0.3s infinite; border-color: #ff0000 !important; }

    @keyframes white-flash {
      0% { background: #fff; }
      100% { background: #2b1d0c; }
    }
    .flash-bg { animation: white-flash 0.2s ease-out; }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="canvas" width="360" height="640"></canvas>
    
    <div class="ui-top">
      <div>売上金: <span class="ui-money" id="money-txt">0 円</span> | 残り: <span id="time-txt">120</span> 秒</div>
      <div style="color: #ffcc00; font-size: 13px; margin: 2px 0;">くりまんじゅう: <span id="count-txt">100,000</span> 個</div>
      <div>皿の栗: <span id="holding-txt">0</span>/10 個 | さばいた客: <span id="served-txt">0</span>/10人</div>
    </div>

    <div id="status-msg">上部で栗をなぞって皿に取り、カウンターで客に提供せよ！</div>
  </div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const container = document.getElementById('game-container');

// --- ゲームパラメータ ---
let count = 100000; // 初期値 100,000個
const maxCount = 10006000000; // 100億6000個
let timeLeft = 120; // 2分 (120秒)
let money = 0; // 売上金（1個500円）
let servedCustomerCount = 0; // さばいた客数
let phase = 1; // 1: プレイ中, 2: クリア, 3: ゲームオーバー

// プレイヤー（ももちゃん）
let player = { x: 100, y: 300, r: 16, holding: 0, maxHolding: 10, stunnedUntil: 0 };

// 爆発栗まんじゅう（💥）
let bombManjus = [];

// ベルトコンベア仕様
let conveyorUnlocked = false; // 10人さばくとtrue
let conveyorBox = 0; // 箱の中の栗の数（最大20個）
let conveyorX = 140, conveyorY = 285;

// KIDちゃん（リス）
let kid = { x: 310, y: 300, w: 40, h: 40, stock: 0, maxStock: 3, lastEat: Date.now() };

// イートイン＆客の管理
let customers = []; // 行列の客
let servedTableCustomers = []; // イートイン席で食べている客
const maxTableSeats = 12; // 3テーブル × 椅子4脚 = 12席

// タイマー＆増殖管理
let lastMultiply = Date.now();
let lastSubSecond = Date.now();

// 客のスポーン（行列追加）
function spawnCustomer() {
  if (customers.length < 8) {
    customers.push({ id: Date.now(), itemsNeeded: 5 });
  }
}
for(let i=0; i<5; i++) spawnCustomer();

// メインタイマー（1秒ごと）
const timerInterval = setInterval(() => {
  if (phase === 1 && timeLeft > 0) {
    timeLeft--;
    spawnCustomer(); // 毎秒客が来店

    // 爆発栗のランダムスポーン（上部厨房エリア）
    if (Math.random() < 0.25 && bombManjus.length < 4) {
      bombManjus.push({
        x: 30 + Math.random() * 300,
        y: 40 + Math.random() * 180,
        r: 12
      });
    }

  } else if (timeLeft <= 0 && phase === 1) {
    phase = 2; // クリア！
    clearInterval(timerInterval);
  }
}, 1000);

function gameLoop() {
  update();
  draw();
  if (phase === 1) requestAnimationFrame(gameLoop);
}

function update() {
  if (phase !== 1) return;
  const now = Date.now();

  // 1. 増殖ロジック（0.1秒ごとに爆発増殖）
  if (now - lastSubSecond >= 100) { // 0.1秒単位
    const progress = (120 - timeLeft) / 120;
    const mult = 1.008 + (progress * 0.015); // 徐々に加速
    count = Math.min(maxCount, Math.ceil(count * mult));
    lastSubSecond = now;
  }

  // 2. KIDちゃん（リス）の自動消費（0.5秒に3個食べる）
  if (kid.stock > 0 && now - kid.lastEat >= 500) {
    const eatAmount = Math.min(kid.stock, 3);
    kid.stock -= eatAmount;
    count = Math.max(0, count - eatAmount);
    money += eatAmount * 500;
    kid.lastEat = now;
  }

  // 3. イートイン客の食事消費処理（食べた客は順次退店）
  for (let i = servedTableCustomers.length - 1; i >= 0; i--) {
    let c = servedTableCustomers[i];
    if (now - c.startEatTime > 3000) { // 3秒かけて食べる
      servedTableCustomers.splice(i, 1); // 退店
    }
  }

  // 4. ベルトコンベア自動出荷（20個たまると外へ流れて一括出荷）
  if (conveyorUnlocked && conveyorBox >= 20) {
    count = Math.max(0, count - 20);
    money += 20 * 500;
    conveyorBox = 0; // 箱をリセットして次の箱へ
  }

  // 5. ピンチ＆ゲームオーバー判定
  const fillRatio = Math.min(1.0, count / maxCount);
  if (fillRatio >= 0.75) container.classList.add('pinch-mode');
  else container.classList.remove('pinch-mode');

  if (count >= maxCount) phase = 3;

  // UI更新
  document.getElementById('count-txt').innerText = count.toLocaleString();
  document.getElementById('money-txt').innerText = money.toLocaleString() + " 円";
  document.getElementById('holding-txt').innerText = player.holding;
  document.getElementById('served-txt').innerText = servedCustomerCount;
  document.getElementById('time-txt').innerText = timeLeft;

  const msg = document.getElementById('status-msg');
  if (now < player.stunnedUntil) {
    msg.innerText = "💥 爆発栗を踏んでしまった！操作不能！";
    msg.style.color = "#ff4444";
  } else if (!conveyorUnlocked && servedCustomerCount >= 10) {
    conveyorUnlocked = true;
    msg.innerText = "🎉 祝・10人さばいた！ベルトコンベアが設置された！";
    msg.style.color = "#55ff55";
  } else if (conveyorUnlocked) {
    msg.innerText = "コンベアの箱に栗（20個）を詰めて外へ出荷せよ！";
    msg.style.color = "#ffeb3b";
  } else {
    msg.innerText = "厨房で栗を取り、カウンターで客に提供せよ！";
    msg.style.color = "#ffffff";
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (phase === 2) { // クリア
    container.classList.remove('pinch-mode');
    ctx.fillStyle = '#050510'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ffcc00'; ctx.font = 'bold 18px sans-serif';
    ctx.fillText("【2分間耐え切りクリア！】", 60, 220);
    ctx.font = '14px sans-serif'; ctx.fillStyle = '#55ff55';
    ctx.fillText(`最終売上：${money.toLocaleString()} 円`, 70, 270);
    
    // 金・銀・銅エンディング分岐
    ctx.fillStyle = '#fff'; ctx.font = 'bold 13px sans-serif';
    if (money >= 500000) {
      ctx.fillText("やったねKIDちゃん！【金閣寺】が建ったよ！", 30, 340);
      ctx.fillText("トイレも全部金ピカだよ！！", 60, 370);
    } else if (money >= 200000) {
      ctx.fillText("やったね！シックで粋な【銀閣寺】が建ったよ！", 25, 340);
    } else {
      ctx.fillText("なんとか耐えた！【銅閣寺】が建ったよ！", 40, 340);
    }
    return;
  }

  if (phase === 3) { // ゲームオーバー
    container.classList.remove('pinch-mode');
    ctx.fillStyle = '#1a0000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ff4444'; ctx.font = 'bold 20px sans-serif';
    ctx.fillText("100億6000個突破！", 70, 250);
    ctx.fillText("GAME OVER", 110, 290);
    ctx.font = '13px sans-serif'; ctx.fillStyle = '#aaa';
    ctx.fillText("厨房とお店が栗で完全埋没した…", 60, 340);
    return;
  }

  // --- レイアウト描画（線画準拠） ---

  // 1. 上部：厨房・栗まんじゅう増殖エリア（Y: 0 ~ 260）
  const fillRatio = Math.min(1.0, count / maxCount);
  const fillH = fillRatio * 220;
  ctx.fillStyle = '#5c2c09'; ctx.fillRect(0, 260 - fillH, canvas.width, fillH);
  
  // 栗まんじゅうの模様
  ctx.fillStyle = '#c68642';
  for (let i = 0; i < Math.min(40, Math.floor(fillRatio * 40)); i++) {
    const rx = 20 + ((i * 37) % 320);
    const ry = 250 - fillH + ((i * 19) % Math.max(10, fillH));
    ctx.beginPath(); ctx.arc(rx, ry, 6, 0, Math.PI*2); ctx.fill();
  }

  // 爆発栗まんじゅう（💥）
  bombManjus.forEach(b => {
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#ff3300'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#ff5500'; ctx.font = 'bold 9px sans-serif'; ctx.fillText("💥", b.x - 5, b.y + 3);
  });

  // 2. カウンター ＆ ベルトコンベアエリア（Y: 270 ~ 310）
  ctx.fillStyle = '#8d6e63'; ctx.fillRect(0, 310, canvas.width, 12); // カウンター木枠

  // ベルトコンベア（10人さばくと出現）
  if (conveyorUnlocked) {
    ctx.fillStyle = '#424242'; ctx.fillRect(100, 280, 140, 25);
    ctx.strokeStyle = '#ffb300'; ctx.lineWidth = 2; ctx.strokeRect(100, 280, 140, 25);
    
    // 20個詰め箱
    ctx.fillStyle = '#d7ccc8'; ctx.fillRect(conveyorX, conveyorY, 35, 20);
    ctx.fillStyle = '#3e2723'; ctx.font = 'bold 10px sans-serif';
    ctx.fillText(`📦${conveyorBox}/20`, conveyorX + 2, conveyorY + 14);
  } else {
    ctx.fillStyle = '#555'; ctx.font = '10px sans-serif';
    ctx.fillText("【10人達成でコンベア設置】", 110, 295);
  }

  // KIDちゃん（右上カウンター端）
  ctx.fillStyle = '#795548'; ctx.fillRect(kid.x, kid.y, kid.w, kid.h);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(kid.x, kid.y, kid.w, kid.h);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 10px sans-serif';
  ctx.fillText(`🐿️KID`, kid.x + 2, kid.y + 15);
  ctx.fillText(`${kid.stock}/3個`, kid.x + 4, kid.y + 30);

  // 3. 中央下：お客さんの行列（Y: 340 ~ 400）
  ctx.fillStyle = '#aaa'; ctx.font = '10px sans-serif'; ctx.fillText("【レジ行列】", 10, 335);
  customers.forEach((c, idx) => {
    const cx = 30 + (idx * 35);
    const cy = 360;
    ctx.fillStyle = '#2196f3'; // 青い人形（客）
    ctx.beginPath(); ctx.arc(cx, cy - 10, 8, 0, Math.PI*2); ctx.fill(); // 頭
    ctx.fillRect(cx - 5, cy - 2, 10, 15); // 体
  });

  // 4. 下部 1/3：イートインスペース（テーブル3台・椅子） (Y: 430 ~ 630)
  const tables = [{x: 60, y: 480}, {x: 180, y: 480}, {x: 300, y: 480}];
  tables.forEach((t, tIdx) => {
    // テーブル（丸）
    ctx.fillStyle = '#a1887f'; ctx.beginPath(); ctx.arc(t.x, t.y, 30, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#5d4037'; ctx.lineWidth = 2; ctx.stroke();

    // 椅子（上下左右4つ）
    const chairs = [{x: t.x-38, y: t.y}, {x: t.x+38, y: t.y}, {x: t.x, y: t.y-38}, {x: t.x, y: t.y+38}];
    chairs.forEach(ch => {
      ctx.fillStyle = '#8d6e63'; ctx.beginPath(); ctx.arc(ch.x, ch.y, 8, 0, Math.PI*2); ctx.fill();
    });
  });

  // イートイン席で食べている客の描画
  servedTableCustomers.forEach((c, idx) => {
    const tIdx = idx % 3;
    const seatIdx = Math.floor(idx / 3) % 4;
    const t = tables[tIdx];
    const offsets = [{x:-38,y:0}, {x:38,y:0}, {x:0,y:-38}, {x:0,y:38}];
    const pos = offsets[seatIdx];

    ctx.fillStyle = '#1e88e5'; // 食事中の青い客
    ctx.beginPath(); ctx.arc(t.x + pos.x, t.y + pos.y - 4, 7, 0, Math.PI*2); ctx.fill();
  });

  // 5. プレイヤー（ももちゃん）
  const isStunned = Date.now() < player.stunnedUntil;
  ctx.fillStyle = isStunned ? '#ff4444' : '#ffeb3b';
  ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#d2691e'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = '#000'; ctx.font = 'bold 11px sans-serif';
  ctx.fillText(`🍑${player.holding}`, player.x - 10, player.y + 4);
}

// タッチ＆マウス入力
function handleInput(x, y) {
  if (phase !== 1) return;
  const now = Date.now();
  if (now < player.stunnedUntil) return; // スタン中移動不可

  player.x = x; player.y = y; // 移動

  // A. 厨房エリア（Y < 240）：栗まんじゅうを皿に取る（10個まで）
  if (y < 240 && player.holding < player.maxHolding) {
    player.holding = Math.min(player.maxHolding, player.holding + 1);
  }

  // B. 爆発栗まんじゅう踏み判定（💥0.5秒スタン）
  for (let i = bombManjus.length - 1; i >= 0; i--) {
    let b = bombManjus[i];
    if (Math.hypot(x - b.x, y - b.y) < player.r + b.r) {
      bombManjus.splice(i, 1);
      player.stunnedUntil = now + 500; // 0.5秒スタン！
      container.classList.add('flash-bg');
      setTimeout(() => container.classList.remove('flash-bg'), 200);
      return;
    }
  }

  // C. カウンター客への提供 (280 < Y < 340)
  if (y >= 270 && y <= 340) {
    // 1. 客へ提供（5個持っている場合）
    if (customers.length > 0 && player.holding >= 5) {
      player.holding -= 5;
      customers.shift(); // 行列先頭を処理
      servedCustomerCount++;
      count = Math.max(0, count - 5);
      money += 5 * 500;

      // イートイン／テイクアウト切り替え分岐
      if (servedTableCustomers.length < maxTableSeats) {
        // テーブルに空きがあればイートイン
        servedTableCustomers.push({ startEatTime: now });
      } // 満杯ならテイクアウト（即退店で加速！）
    }

    // 2. ベルトコンベアへの箱詰め
    if (conveyorUnlocked && player.holding > 0 && Math.abs(x - (conveyorX + 15)) < 30) {
      const put = Math.min(player.holding, 20 - conveyorBox);
      player.holding -= put;
      conveyorBox += put;
    }

    // 3. KIDちゃん（リス）への運搬補給
    if (player.holding > 0 && Math.abs(x - (kid.x + 20)) < 30) {
      const give = Math.min(player.holding, kid.maxStock - kid.stock);
      player.holding -= give;
      kid.stock += give;
    }
  }
}

// イベント登録
canvas.addEventListener('mousedown', (e) => { const r = canvas.getBoundingClientRect(); handleInput(e.clientX - r.left, e.clientY - r.top); });
canvas.addEventListener('mousemove', (e) => { if (e.buttons === 1) { const r = canvas.getBoundingClientRect(); handleInput(e.clientX - r.left, e.clientY - r.top); } });

canvas.addEventListener('touchstart', (e) => { const r = canvas.getBoundingClientRect(); handleInput(e.touches[0].clientX - r.left, e.touches[0].clientY - r.top); }, { passive: true });
canvas.addEventListener('touchmove', (e) => { const r = canvas.getBoundingClientRect(); handleInput(e.touches[0].clientX - r.left, e.touches[0].clientY - r.top); }, { passive: true });

gameLoop();
</script>
</body>
</html>
